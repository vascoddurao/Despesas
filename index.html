<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#087f5b"><meta name="apple-mobile-web-app-capable" content="yes"><title>Despesas</title><style>
:root{--g:#087f5b;--p:#e8f5ef;--r:#c92a2a;--b:#dce6e1;--m:#68756f}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#f4f7f5;color:#17211d;font:16px system-ui}.app{max-width:680px;margin:auto;padding:0 14px calc(86px + env(safe-area-inset-bottom))}.view{display:none}.view.on{display:block}.top{position:sticky;top:0;z-index:3;margin:0 -14px 12px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:#fffffff2;border-bottom:1px solid var(--b)}h1{font-size:24px;margin:0}.card{background:white;border:1px solid var(--b);border-radius:18px;padding:16px;margin:12px 0}.field{margin:14px 0}label{display:block;font-weight:750;margin-bottom:7px}.optional,.muted{color:var(--m);font-size:13px}input,select{width:100%;min-height:48px;border:1px solid #cbd8d2;border-radius:12px;padding:11px 12px;background:white;font-size:16px}#cost{font-size:22px;font-weight:750;letter-spacing:.4px}.seg,.row{display:flex;gap:8px}.seg>*{flex:1}.seg{padding:4px;background:#edf2f0;border-radius:13px}.seg button,.btn{border:0;border-radius:11px;min-height:46px;padding:9px 12px;font-weight:750}.seg button{background:transparent}.seg .active{background:white}.primary{background:var(--g);color:white}.secondary{background:var(--p);color:#075f45}.danger{background:#fff0f0;color:var(--r)}.full{width:100%}.hidden{display:none!important}.result{margin-top:7px;padding:9px;border-radius:10px;background:var(--p);color:#075f45;font-weight:750}.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.key{min-height:52px;border:0;border-radius:12px;background:#f0f3f2;font-size:20px;font-weight:800}.key.op{background:var(--p);color:#075f45}.key.clear{grid-column:span 2;background:#fff0f0;color:var(--r);font-size:15px}.error{padding:10px;background:#fff0f0;color:#a61e1e;border-radius:10px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:white;border:1px solid var(--b);border-radius:15px;padding:13px}.big{font-size:22px;font-weight:800}.item{border:1px solid var(--b);border-radius:14px;padding:12px;margin-top:9px;background:white}.itemtop{display:flex;justify-content:space-between;gap:8px}.tag{display:inline-block;background:var(--p);color:#075f45;border-radius:99px;padding:3px 8px;font-size:12px;margin:5px 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:5;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:#fffffff2;border-top:1px solid var(--b)}.nav{max-width:680px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}.nav button{min-height:50px;border:0;border-radius:13px;font-weight:800}.nav .active{background:var(--g);color:white}.modal{position:fixed;inset:0;z-index:9;background:#0009;display:none;align-items:flex-end}.modal.on{display:flex}.sheet{width:100%;max-width:680px;max-height:90vh;overflow:auto;margin:auto;background:white;border-radius:22px 22px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom))}.sheethead{display:flex;justify-content:space-between;align-items:center}.catbox{border:1px solid var(--b);border-radius:12px;padding:10px;margin-top:8px}@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:22px}}
</style></head><body><main class="app"><section id="register" class="view on"><header class="top"><h1>Registar despesa</h1></header><div class="card"><form id="form"><div class="field"><label>Dia</label><div class="seg"><button type="button" id="todayBtn" class="active" onclick="setDateMode('today')">Hoje</button><button type="button" id="otherBtn" onclick="setDateMode('other')">Outro dia</button></div><input id="date" type="date" class="hidden" style="margin-top:8px"></div><div class="field"><label>Valor ou conta (€)</label><input id="cost" inputmode="none" readonly autocomplete="off" placeholder="0,00" onclick="showKeypad()"><div id="result" class="result hidden"></div><div id="keypad" class="keypad"><button type="button" class="key" onclick="key('7')">7</button><button type="button" class="key" onclick="key('8')">8</button><button type="button" class="key" onclick="key('9')">9</button><button type="button" class="key op" onclick="key('/')">÷</button><button type="button" class="key" onclick="key('4')">4</button><button type="button" class="key" onclick="key('5')">5</button><button type="button" class="key" onclick="key('6')">6</button><button type="button" class="key op" onclick="key('*')">×</button><button type="button" class="key" onclick="key('1')">1</button><button type="button" class="key" onclick="key('2')">2</button><button type="button" class="key" onclick="key('3')">3</button><button type="button" class="key op" onclick="key('-')">−</button><button type="button" class="key" onclick="key('0')">0</button><button type="button" class="key" onclick="key(',')">,</button><button type="button" class="key" onclick="backspace()">⌫</button><button type="button" class="key op" onclick="key('+')">+</button><button type="button" class="key op" onclick="key('(')">(</button><button type="button" class="key op" onclick="key(')')">)</button><button type="button" class="key clear" onclick="clearCost()">Limpar</button></div></div><div class="field"><label>Descrição</label><input id="description" placeholder="Ex.: Cervejas"></div><div class="field"><label>Categoria <span class="optional">opcional</span></label><select id="category" onchange="fillSubs()"></select></div><div class="field"><label>Subcategoria <span class="optional">opcional</span></label><select id="subcategory"></select></div><p id="error" class="error hidden"></p><div class="row"><button class="btn primary" style="flex:1" type="submit" id="saveBtn">Registar despesa</button><button class="btn secondary hidden" type="button" id="cancelBtn" onclick="resetForm()">Cancelar</button></div></form></div><button class="btn secondary full" onclick="openCats()">Gerir categorias</button></section><section id="consult" class="view"><header class="top"><h1>Consultar despesas</h1></header><div class="stats"><div class="stat"><div class="muted">Total deste mês</div><div class="big" id="monthTotal"></div></div><div class="stat"><div class="muted">Por exportar</div><div class="big" id="pendingCount"></div></div></div><button class="btn primary full" style="margin-top:12px" onclick="exportNew()">Exportar novas para Excel</button><div class="card"><h2>Por exportar</h2><div id="pendingList"></div></div><div class="card"><h2>Já exportadas</h2><div class="row"><button class="btn secondary" onclick="exportOld()">Reexportar</button><button class="btn danger" onclick="clearOld()">Limpar todas</button></div><div id="oldList"></div></div></section></main><nav class="bottom"><div class="nav"><button id="navRegister" class="active" onclick="showView('register')">＋ Registar</button><button id="navConsult" onclick="showView('consult')">☰ Consultar</button></div></nav><div id="modal" class="modal"><div class="sheet"><div class="sheethead"><h2>Gerir categorias</h2><button class="btn secondary" onclick="closeCats()">Fechar</button></div><div class="row"><input id="newCat" placeholder="Nova categoria"><button class="btn primary" onclick="addCat()">Adicionar</button></div><div class="row" style="margin-top:8px"><select id="targetCat"></select><input id="newSub" placeholder="Nova subcategoria"><button class="btn primary" onclick="addSub()">Adicionar</button></div><div id="catList"></div></div></div><script>
const D={"Programas usuais/Misc":["Cafés, Cervejas & Convívios","Almoços & Jantares","Tabaco","Hambúrgueres e talheres","Desporto","Saídas","Outros"],"Comida trabalho/desnecessária":["Almoços fora (trabalho)","Lanches (trabalho)","Refeições necessárias (trabalho)","Doces","Outra comida desnecessária"],Casa:["Cerveja","Contribuição para casa","Outros"],Carro:["Gasolina","Estacionamento","Portagens"],Saúde:["Psicólogo/Psiquiatra","Antidepressivos","Tratamento de cabelo","Outras consultas","Outros"],"Fixos mensais":["Despesas com roupa","Subscrições de entretenimento","Outras subscrições","Quotas"],"Fixos anuais":["Carro - Selo, Seguro & Inspeção","Subscrições de entretenimento","Outras subscrições","Passe temporada Belém"],"Atípicos necessários":["Barbeiro","Carro - Problemas","Roupa para trabalho","Outros"],"Programas extraordinários":["Concertos & Festivais","Fins de semana","Outros"],Férias:["[adicionar 1]","[adicionar 2]","[adicionar 3]"],"Compras pessoais":["Vinyl","Videojogos","Lego","Roupa","Outros"],Prendas:["Anos","Natal","Outras"]};
const $=x=>document.getElementById(x),today=()=>{let d=new Date;d=new Date(d-d.getTimezoneOffset()*60000);return d.toISOString().slice(0,10)},eur=n=>new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR'}).format(n),pt=s=>new Intl.DateTimeFormat('pt-PT').format(new Date(s+'T12:00:00')),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let E=JSON.parse(localStorage.getItem('despesas-registos')||'[]'),C=JSON.parse(localStorage.getItem('despesas-categorias')||'null')||D,editing=null,dateMode='today';$('date').value=today();
function save(){localStorage.setItem('despesas-registos',JSON.stringify(E));localStorage.setItem('despesas-categorias',JSON.stringify(C))}function calc(v){let s=v.replace(/,/g,'.');if(!s||!/^[0-9+\-*/().\s]+$/.test(s))throw 0;let n=Function('"use strict";return('+s+')')();if(!Number.isFinite(n)||n<=0)throw 0;return n}function preview(){try{$('result').textContent='Resultado: '+eur(calc($('cost').value));$('result').classList.remove('hidden')}catch{$('result').classList.add('hidden')}}function showKeypad(){$('keypad').classList.remove('hidden')}function key(v){let el=$('cost'),last=el.value.slice(-1);if(v===','&&el.value.split(/[+\-*/()]/).pop().includes(','))return;if(/[+\-*/]/.test(v)&&(/[+\-*/]/.test(last)||!el.value&&v!=='-'))return;el.value+=v;preview();navigator.vibrate?.(12)}function backspace(){$('cost').value=$('cost').value.slice(0,-1);preview()}function clearCost(){$('cost').value='';preview()}function setDateMode(m){dateMode=m;$('date').classList.toggle('hidden',m==='today');$('todayBtn').classList.toggle('active',m==='today');$('otherBtn').classList.toggle('active',m==='other')}function showView(v){$('register').classList.toggle('on',v==='register');$('consult').classList.toggle('on',v==='consult');$('navRegister').classList.toggle('active',v==='register');$('navConsult').classList.toggle('active',v==='consult');if(v==='consult')render();scrollTo({top:0})}function fillCats(){let v=$('category').value;$('category').innerHTML='<option value="">TBD</option>'+Object.keys(C).map(c=>`<option ${c===v?'selected':''}>${esc(c)}</option>`).join('');fillSubs()}function fillSubs(){let c=$('category').value,v=$('subcategory').dataset.v||'';$('subcategory').innerHTML='<option value="">TBD</option>'+((C[c]||[]).map(s=>`<option ${s===v?'selected':''}>${esc(s)}</option>`).join(''));delete $('subcategory').dataset.v}
$('form').onsubmit=e=>{e.preventDefault();let expression=$('cost').value,cost;try{cost=calc(expression)}catch{return error('Introduz uma conta válida.')}let old=editing?E.find(x=>x.id===editing):null,r={id:editing||crypto.randomUUID(),date:dateMode==='today'?today():$('date').value,cost,costExpression:expression,description:$('description').value.trim(),category:$('category').value||'TBD',subcategory:$('subcategory').value||'TBD',exported:old?.exported||false,exportedAt:old?.exportedAt||null};E=editing?E.map(x=>x.id===editing?r:x):[r,...E];save();resetForm()};function error(t){$('error').textContent=t;$('error').classList.remove('hidden')}function resetForm(){editing=null;$('cost').value=$('description').value='';$('category').value='';fillSubs();preview();$('error').classList.add('hidden');$('saveBtn').textContent='Registar despesa';$('cancelBtn').classList.add('hidden')}function edit(id){let x=E.find(y=>y.id===id);editing=id;$('cost').value=x.costExpression||x.cost;$('description').value=x.description;$('category').value=x.category==='TBD'?'':x.category;$('subcategory').dataset.v=x.subcategory==='TBD'?'':x.subcategory;fillSubs();$('saveBtn').textContent='Guardar alterações';$('cancelBtn').classList.remove('hidden');preview();showView('register')}function del(id){if(confirm('Eliminar esta despesa?')){E=E.filter(x=>x.id!==id);save();render()}}function restore(id){E=E.map(x=>x.id===id?{...x,exported:false}:x);save();render()}
function item(x,o){return`<div class="item"><div class="itemtop"><div><strong>${esc(x.description||x.subcategory)}</strong><div class="muted">${esc(x.costExpression||x.cost)} = ${eur(x.cost)}</div></div><strong>${eur(x.cost)}</strong></div><span class="tag">${esc(x.category||'TBD')} · ${esc(x.subcategory||'TBD')}</span><div class="muted">${pt(x.date)}</div><div class="actions"><button class="btn secondary" onclick="${o?'restore':'edit'}('${x.id}')">${o?'Repor':'Editar'}</button><button class="btn danger" onclick="del('${x.id}')">Eliminar</button></div></div>`}function render(){let p=E.filter(x=>!x.exported),o=E.filter(x=>x.exported),m=today().slice(0,7);$('monthTotal').textContent=eur(E.filter(x=>x.date.startsWith(m)).reduce((a,x)=>a+x.cost,0));$('pendingCount').textContent=p.length;$('pendingList').innerHTML=p.length?p.map(x=>item(x,0)).join(''):'<p class="muted">Sem despesas.</p>';$('oldList').innerHTML=o.length?o.map(x=>item(x,1)).join(''):'<p class="muted">Sem despesas.</p>'}function download(a,name){let q=v=>'"'+String(v??'').replaceAll('"','""')+'"',rows=[['Data','Descrição','Custo','Categoria','Subcategoria'],...a.map(x=>[x.date,x.description,'='+(x.costExpression||x.cost).toString().replaceAll('.',','),x.category||'TBD',x.subcategory||'TBD'])],b=new Blob(['\ufeff'+rows.map(r=>r.map(q).join(';')).join('\r\n')],{type:'text/csv'}),u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download=name+'_'+today()+'.csv';l.click();URL.revokeObjectURL(u)}function exportNew(){let p=E.filter(x=>!x.exported);if(!p.length)return alert('Sem despesas novas.');download(p,'despesas');let ids=new Set(p.map(x=>x.id));E=E.map(x=>ids.has(x.id)?{...x,exported:true}:x);save();render()}function exportOld(){let o=E.filter(x=>x.exported);if(o.length)download(o,'despesas_ja_exportadas')}function clearOld(){if(confirm('Limpar todas as exportadas?')){E=E.filter(x=>!x.exported);save();render()}}
function openCats(){$('modal').classList.add('on');drawCats()}function closeCats(){$('modal').classList.remove('on');fillCats()}function drawCats(){$('targetCat').innerHTML=Object.keys(C).map(c=>`<option>${esc(c)}</option>`).join('');$('catList').innerHTML=Object.entries(C).map(([c,s])=>`<div class="catbox"><strong>${esc(c)}</strong><div class="muted">${s.map(esc).join(' · ')}</div></div>`).join('')}function addCat(){let n=$('newCat').value.trim();if(n&&!C[n]){C[n]=[];$('newCat').value='';save();drawCats()}}function addSub(){let c=$('targetCat').value,n=$('newSub').value.trim();if(c&&n&&!C[c].includes(n)){C[c].push(n);$('newSub').value='';save();drawCats()}}fillCats();render();
</script></body></html>

<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#087f5b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Despesas"><title>As minhas despesas</title><style>
:root{--g:#087f5b;--gd:#066747;--p:#e9f6f0;--r:#c92a2a;--bg:#f4f7f5;--b:#dce6e1;--m:#66736d;--safe-b:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font:16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:#17211d}button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation}.app{max-width:680px;margin:auto;min-height:100vh;padding:0 14px calc(88px + var(--safe-b))}.top{position:sticky;top:0;z-index:5;margin:0 -14px 14px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;background:#ffffffed;backdrop-filter:blur(12px);border-bottom:1px solid var(--b)}.top h1{font-size:24px;margin:0}.view{display:none}.view.on{display:block}.card{background:white;border:1px solid var(--b);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 5px 20px #173b2b0a}.field{margin:14px 0}label{display:block;font-weight:700;margin-bottom:7px}.optional{font-weight:500;color:var(--m);font-size:13px}input,select{width:100%;min-height:48px;border:1px solid #cbd8d2;border-radius:12px;padding:11px 12px;background:white;font-size:16px}input:focus,select:focus{outline:3px solid #bdebd8;border-color:var(--g)}.seg{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:4px;background:#edf2f0;border-radius:13px}.seg button{min-height:44px;border:0;border-radius:10px;background:transparent;font-weight:700}.seg .active{background:white;box-shadow:0 2px 8px #0001}.btn{min-height:48px;border:0;border-radius:12px;padding:11px 15px;font-weight:750}.primary{background:var(--g);color:white}.primary:active{background:var(--gd)}.secondary{background:var(--p);color:#075f45}.danger{background:#fff0f0;color:var(--r)}.full{width:100%}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.hint,.muted{color:var(--m);font-size:13px}.result{margin-top:7px;padding:9px 11px;border-radius:10px;background:var(--p);color:#075f45;font-weight:700}.hidden{display:none!important}.error{padding:10px;border-radius:10px;background:#fff0f0;color:#a61e1e}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:white;border:1px solid var(--b);border-radius:16px;padding:14px}.big{font-size:22px;font-weight:800;margin-top:3px}.item{border:1px solid var(--b);border-radius:14px;padding:13px;margin-top:10px;background:white}.itemtop{display:flex;justify-content:space-between;gap:10px}.amount{font-weight:800;white-space:nowrap}.tag{display:inline-block;margin:6px 0 3px;padding:3px 8px;border-radius:999px;background:var(--p);color:#075f45;font-size:12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.actions .btn{min-height:40px;padding:7px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:8px}.section-title h2{font-size:19px;margin:0}.bottom{position:fixed;z-index:10;bottom:0;left:0;right:0;padding:8px 12px calc(8px + var(--safe-b));background:#fffffff2;backdrop-filter:blur(12px);border-top:1px solid var(--b)}.nav{max-width:680px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}.nav button{min-height:51px;border:0;border-radius:13px;font-weight:800;background:#edf2f0;color:#41504a}.nav button.active{background:var(--g);color:white}.modal{position:fixed;z-index:20;inset:0;background:#0009;display:none;align-items:flex-end}.modal.on{display:flex}.sheet{width:100%;max-width:680px;max-height:92vh;margin:auto;background:white;border-radius:22px 22px 0 0;padding:18px 16px calc(20px + var(--safe-b));overflow:auto}.sheethead{display:flex;justify-content:space-between;align-items:center;gap:10px}.catbox{border:1px solid var(--b);padding:11px;border-radius:12px;margin-top:9px}.cathead{display:flex;justify-content:space-between;gap:8px}.chips{margin-top:6px}.chip{display:inline-flex;align-items:center;gap:4px;background:#f0f4f2;border-radius:99px;padding:5px 8px;margin:3px;font-size:13px}.chip button{border:0;background:none;color:var(--r);padding:0 2px;font-weight:800}@media(min-width:700px){.app{padding-top:15px}.modal{align-items:center}.sheet{border-radius:22px;max-height:85vh}}
</style></head><body><main class="app"><section id="register" class="view on"><header class="top"><h1>Registar despesa</h1></header><div class="card"><form id="form"><div class="field"><label>Dia</label><div class="seg"><button type="button" id="todayBtn" class="active" onclick="setDateMode('today')">Hoje</button><button type="button" id="otherBtn" onclick="setDateMode('other')">Outro dia</button></div><input id="date" type="date" class="hidden" style="margin-top:8px"></div><div class="field"><label>Valor ou conta (€)</label><input id="cost" inputmode="text" autocomplete="off" placeholder="Ex.: 10/2 ou 1,8*5" oninput="preview()"><div class="hint">Aceita +, −, ×, ÷ e parênteses.</div><div id="result" class="result hidden"></div></div><div class="field"><label>Descrição</label><input id="description" autocomplete="off" placeholder="Ex.: Cervejas"></div><div class="field"><label>Categoria <span class="optional">opcional</span></label><select id="category" onchange="fillSubcategories()"></select></div><div class="field"><label>Subcategoria <span class="optional">opcional</span></label><select id="subcategory"></select></div><p id="error" class="error hidden"></p><div class="row"><button class="btn primary" type="submit" id="saveBtn">Registar despesa</button><button class="btn secondary hidden" type="button" id="cancelBtn" onclick="resetForm()">Cancelar</button></div></form></div><button class="btn secondary full" onclick="openCategories()">Gerir categorias</button></section><section id="consult" class="view"><header class="top"><h1>Consultar despesas</h1></header><div class="stats"><div class="stat"><div class="muted">Total deste mês</div><div class="big" id="monthTotal">0,00 €</div></div><div class="stat"><div class="muted">Por exportar</div><div class="big" id="pendingCount">0</div></div></div><button class="btn primary full" style="margin-top:12px" onclick="exportNew()">Exportar novas para Excel</button><div class="card"><div class="section-title"><h2>Por exportar</h2></div><div id="pendingList"></div></div><div class="card"><div class="section-title"><h2>Já exportadas</h2></div><div class="row" style="margin-top:10px"><button class="btn secondary" onclick="exportOld()">Reexportar</button><button class="btn danger" onclick="clearOld()">Limpar todas</button></div><div id="oldList"></div></div></section></main><nav class="bottom"><div class="nav"><button id="navRegister" class="active" onclick="showView('register')">＋ Registar</button><button id="navConsult" onclick="showView('consult')">☰ Consultar</button></div></nav><div id="modal" class="modal" onclick="if(event.target===this)closeCategories()"><div class="sheet"><div class="sheethead"><h2>Gerir categorias</h2><button class="btn secondary" onclick="closeCategories()">Fechar</button></div><div class="row"><input id="newCategory" placeholder="Nova categoria"><button class="btn primary" onclick="addCategory()">Adicionar</button></div><div class="row" style="margin-top:9px"><select id="targetCategory"></select><input id="newSubcategory" placeholder="Nova subcategoria"><button class="btn primary" onclick="addSubcategory()">Adicionar</button></div><div id="categoryList"></div></div></div><script>
const defaults={"Programas usuais/Misc":["Cafés, Cervejas & Convívios","Almoços & Jantares","Tabaco","Hambúrgueres e talheres","Desporto","Saídas","Outros"],"Comida trabalho/desnecessária":["Almoços fora (trabalho)","Lanches (trabalho)","Refeições necessárias (trabalho)","Doces","Outra comida desnecessária"],"Casa":["Cerveja","Contribuição para casa","Outros"],"Carro":["Gasolina","Estacionamento","Portagens"],"Saúde":["Psicólogo/Psiquiatra","Antidepressivos","Tratamento de cabelo","Outras consultas","Outros"],"Fixos mensais":["Despesas com roupa","Subscrições de entretenimento","Outras subscrições","Quotas"],"Fixos anuais":["Carro - Selo, Seguro & Inspeção","Subscrições de entretenimento","Outras subscrições","Passe temporada Belém"],"Atípicos necessários":["Barbeiro","Carro - Problemas","Roupa para trabalho","Outros"],"Programas extraordinários":["Concertos & Festivais","Fins de semana","Outros"],"Férias":["[adicionar 1]","[adicionar 2]","[adicionar 3]"],"Compras pessoais":["Vinyl","Videojogos","Lego","Roupa","Outros"],"Prendas":["Anos","Natal","Outras"]};
const $=id=>document.getElementById(id),today=()=>{let d=new Date();d=new Date(d-d.getTimezoneOffset()*60000);return d.toISOString().slice(0,10)},eur=n=>new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR'}).format(n),datePt=s=>new Intl.DateTimeFormat('pt-PT').format(new Date(s+'T12:00:00')),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let expenses=JSON.parse(localStorage.getItem('despesas-registos')||'[]'),categories=JSON.parse(localStorage.getItem('despesas-categorias')||'null')||structuredClone(defaults),editing=null,dateMode='today';$('date').value=today();
function persist(){localStorage.setItem('despesas-registos',JSON.stringify(expenses));localStorage.setItem('despesas-categorias',JSON.stringify(categories))}function calculate(raw){let s=String(raw).trim().replace(/,/g,'.');if(!s||!/^[0-9+\-*/().\s]+$/.test(s))throw 0;let n=Function('"use strict";return('+s+')')();if(!Number.isFinite(n)||n<=0)throw 0;return n}function excelFormula(raw){return'='+String(raw).trim().replace(/\s/g,'').replace(/\./g,',')}function preview(){try{$('result').textContent='Resultado: '+eur(calculate($('cost').value));$('result').classList.remove('hidden')}catch{$('result').classList.add('hidden')}}function setDateMode(m){dateMode=m;$('date').classList.toggle('hidden',m==='today');$('todayBtn').classList.toggle('active',m==='today');$('otherBtn').classList.toggle('active',m==='other');if(m==='today')$('date').value=today()}function showView(v){$('register').classList.toggle('on',v==='register');$('consult').classList.toggle('on',v==='consult');$('navRegister').classList.toggle('active',v==='register');$('navConsult').classList.toggle('active',v==='consult');if(v==='consult')render();scrollTo({top:0,behavior:'smooth'})}function fillCategories(){let val=$('category').value;$('category').innerHTML='<option value="">TBD</option>'+Object.keys(categories).map(c=>`<option ${c===val?'selected':''}>${esc(c)}</option>`).join('');fillSubcategories()}function fillSubcategories(){let c=$('category').value,val=$('subcategory').dataset.keep||'';$('subcategory').innerHTML='<option value="">TBD</option>'+((categories[c]||[]).map(s=>`<option ${s===val?'selected':''}>${esc(s)}</option>`).join(''));delete $('subcategory').dataset.keep}
$('form').onsubmit=e=>{e.preventDefault();let expression=$('cost').value.trim(),cost;try{cost=calculate(expression)}catch{return showError('Introduz um valor ou uma conta válida.')}let date=dateMode==='today'?today():$('date').value;if(!date)return showError('Seleciona uma data.');let old=editing?expenses.find(x=>x.id===editing):null,record={id:editing||crypto.randomUUID(),date,cost,costExpression:expression,description:$('description').value.trim(),category:$('category').value||'TBD',subcategory:$('subcategory').value||'TBD',exported:old?.exported||false,exportedAt:old?.exportedAt||null};expenses=editing?expenses.map(x=>x.id===editing?record:x):[record,...expenses];persist();resetForm();navigator.vibrate?.(35)};function showError(t){$('error').textContent=t;$('error').classList.remove('hidden')}function resetForm(){editing=null;setDateMode('today');$('cost').value=$('description').value='';$('category').value='';fillSubcategories();preview();$('error').classList.add('hidden');$('saveBtn').textContent='Registar despesa';$('cancelBtn').classList.add('hidden')}function editExpense(id){let x=expenses.find(y=>y.id===id);editing=id;setDateMode(x.date===today()?'today':'other');$('date').value=x.date;$('cost').value=x.costExpression||String(x.cost).replace('.',',');$('description').value=x.description;$('category').value=x.category==='TBD'?'':x.category;$('subcategory').dataset.keep=x.subcategory==='TBD'?'':x.subcategory;fillSubcategories();preview();$('saveBtn').textContent='Guardar alterações';$('cancelBtn').classList.remove('hidden');showView('register')}function deleteExpense(id){if(confirm('Eliminar esta despesa?')){expenses=expenses.filter(x=>x.id!==id);persist();render()}}function restoreExpense(id){expenses=expenses.map(x=>x.id===id?{...x,exported:false,exportedAt:null}:x);persist();render()}
function item(x,old){return`<article class="item"><div class="itemtop"><div><strong>${esc(x.description||x.subcategory)}</strong><div class="muted">${esc(x.costExpression||x.cost)} = ${eur(x.cost)}</div></div><div class="amount">${eur(x.cost)}</div></div><span class="tag">${esc(x.category||'TBD')} · ${esc(x.subcategory||'TBD')}</span><div class="muted">${datePt(x.date)}</div><div class="actions"><button class="btn secondary" onclick="${old?'restoreExpense':'editExpense'}('${x.id}')">${old?'Repor':'Editar'}</button><button class="btn danger" onclick="deleteExpense('${x.id}')">Eliminar</button></div></article>`}function render(){let p=expenses.filter(x=>!x.exported),o=expenses.filter(x=>x.exported),month=today().slice(0,7);$('monthTotal').textContent=eur(expenses.filter(x=>x.date.startsWith(month)).reduce((a,x)=>a+Number(x.cost),0));$('pendingCount').textContent=p.length;$('pendingList').innerHTML=p.length?p.map(x=>item(x,false)).join(''):'<p class="muted">Não existem despesas por exportar.</p>';$('oldList').innerHTML=o.length?o.map(x=>item(x,true)).join(''):'<p class="muted">Ainda não existem despesas exportadas.</p>'}
function download(items,name){let q=v=>'"'+String(v??'').replaceAll('"','""')+'"',rows=[['Data','Descrição','Custo','Categoria','Subcategoria'],...[...items].sort((a,b)=>a.date.localeCompare(b.date)).map(x=>[x.date,x.description,excelFormula(x.costExpression||String(x.cost).replace('.',',')),x.category||'TBD',x.subcategory||'TBD'])],blob=new Blob(['\ufeff'+rows.map(r=>r.map(q).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name+'_'+today()+'.csv';a.click();URL.revokeObjectURL(url)}function exportNew(){let p=expenses.filter(x=>!x.exported);if(!p.length)return alert('Não existem novas despesas por exportar.');download(p,'despesas');let ids=new Set(p.map(x=>x.id)),stamp=new Date().toISOString();expenses=expenses.map(x=>ids.has(x.id)?{...x,exported:true,exportedAt:stamp}:x);persist();render()}function exportOld(){let o=expenses.filter(x=>x.exported);if(!o.length)return alert('Não existem despesas já exportadas.');download(o,'despesas_ja_exportadas')}function clearOld(){let o=expenses.filter(x=>x.exported);if(o.length&&confirm('Eliminar todas as '+o.length+' despesas já exportadas?')){expenses=expenses.filter(x=>!x.exported);persist();render()}}
function openCategories(){$('modal').classList.add('on');drawCategories()}function closeCategories(){$('modal').classList.remove('on');fillCategories()}function drawCategories(){$('targetCategory').innerHTML=Object.keys(categories).map(c=>`<option>${esc(c)}</option>`).join('');$('categoryList').innerHTML=Object.entries(categories).map(([c,subs])=>`<div class="catbox"><div class="cathead"><strong>${esc(c)}</strong><button class="btn danger" style="min-height:auto;padding:4px 8px" onclick="removeCategory('${encodeURIComponent(c)}')">Eliminar</button></div><div class="chips">${subs.map(s=>`<span class="chip">${esc(s)}<button onclick="removeSubcategory('${encodeURIComponent(c)}','${encodeURIComponent(s)}')">×</button></span>`).join('')}</div></div>`).join('')}function addCategory(){let n=$('newCategory').value.trim();if(n&&!categories[n]){categories[n]=[];$('newCategory').value='';persist();drawCategories()}}function addSubcategory(){let c=$('targetCategory').value,n=$('newSubcategory').value.trim();if(c&&n&&!categories[c].includes(n)){categories[c].push(n);$('newSubcategory').value='';persist();drawCategories()}}function removeCategory(c){c=decodeURIComponent(c);if(confirm('Eliminar esta categoria e as subcategorias?')){delete categories[c];persist();drawCategories()}}function removeSubcategory(c,s){c=decodeURIComponent(c);s=decodeURIComponent(s);categories[c]=categories[c].filter(x=>x!==s);persist();drawCategories()}fillCategories();render();
</script></body></html>
